name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Read-only unless a job asks for more. This repository's default token
# is read-write, and a workflow that declares nothing inherits it, so every
# job here would otherwise hold a write token beside actions it does not
# pin.
permissions:
  contents: read

jobs:
  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: clone rust-fs-core sibling
        # ONE CLONE, SERVING BOTH THINGS CORE IS NEEDED FOR. It used to be
        # two, at two different pins:
        #
        #   - the crate this one COMPILES against, held at v0.2.10 because
        #     from v0.2.11 a write past the end of a FileDevice is a refusal
        #     rather than an implicit extension (rust-fs-core#70, #75), and
        #     appending was how VHDX allocated;
        #   - the core that provides scripts/output-budget.sh, which
        #     scripts/tier.sh resolves and verifies at run time now that no
        #     copy of it is committed here (rust-fs-core#153), and which
        #     cannot go below v0.2.13 -- the first release where a failing
        #     tier is quiet.
        #
        # Allocation asks for the room with `set_len` now (#117), so the
        # dependency can move to the pin the tooling already needed, and the
        # two numbers become one.
        #
        # THE PATH IS EXPORTED FROM BASH, not built out of a
        # github.workspace expression: this job runs on windows-latest, where
        # that expression is a `D:\a\...` path with backslashes in it and
        # every tier step is Git Bash. `pwd` in Git Bash answers in the one
        # spelling the scripts can use.
        shell: bash
        run: |
          git clone --depth 1 --branch v0.3.1 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
          echo "FS_CORE_ROOT=$(cd ../rust-fs-core && pwd)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: build
        # `--features cli` so the command-line tool (the `rust-img-vhdx`
        # target, which requires it) is built, tested and linted on every
        # leg, not only in the `cli` job below.
        run: cargo build --locked --all-targets --features cli
      - name: test
        # QUIET BY DEFAULT: the whole run goes to tmp/logs/debug.log and is
        # uploaded below; this step prints a verdict line and the
        # executed-test count. A failure prints the tail of the log. See the
        # measured budget table at the top of chores.yml, and scripts/tier.sh.
        #
        # EXPECT_OVERFLOW_CHECKS ARMS THE ONE CHECK A TEXT SCAN CANNOT DO.
        # This run has no `--release`, so overflow-checks are on, and it is
        # what makes every arithmetic test in this crate mean anything. The
        # variable tells `overflow_checks::the_build_the_gate_asked_to_check
        # _does_check` in src/lib.rs that THIS is the run that must trap an
        # overflow. It is an `env:` mapping rather than an inline prefix
        # because this job also runs on windows-latest, where that prefix is
        # a PowerShell syntax error. Do not add `--release` and do not drop
        # the variable: tests/ci_profile.rs reads this file and fails if no
        # `cargo test` in it runs without `--release` while setting it (#72).
        #
        # THE FLOOR, BECAUSE THE FAILURE MODE HERE IS AN ABSENCE. `cargo
        # test` exits 0 on "0 passed; 0 failed", so a filter that selects
        # nothing, a build that produced no test binaries, or a suite list
        # that came out empty all report the same green as a full run -- and
        # the empty run is also the one that fits its output budget best.
        # This is the job most able to hide it: it builds --all-targets on
        # three platforms, so a target that stops being built on one of them
        # subtracts its tests from that leg alone, with the other two still
        # green beside it. Measured 2026-09-17 on run 35169423886 (main,
        # caf8dee): 220 executed on each leg. The floor is 235 against the
        # 270 this branch runs; it moves up with the suite and never down.
        #
        # `shell: bash` on every runner, because the tier scripts are bash
        # and the default shell on windows-latest is PowerShell.
        shell: bash
        run: |
          bash scripts/tier.sh "test (debug)" debug 440 30000 -- cargo test --locked --all-targets --features cli
          bash scripts/core.sh test-floor debug 235
        env:
          EXPECT_OVERFLOW_CHECKS: "1"
      - name: keep the tier log
        # `always()`, so the log survives the failure it exists to explain.
        # A failing tier already prints its tail into this job log; this is
        # what keeps the WHOLE run once the runner is gone, which the
        # `if: failure()` "print it again" step it replaces could not do.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-test-${{ matrix.os }}
          path: tmp/logs/
          if-no-files-found: warn
          retention-days: 7
      - name: clippy
        run: cargo clippy --locked --all-targets --features cli -- -D warnings

  # THE PROFILE THAT SHIPS IS NOT THE PROFILE THE TESTS RUN IN.
  #
  # Debug turns an integer overflow into a panic; release lets it wrap.
  # So a test guarding against a wrapping computation passes `cargo
  # test` for the WRONG REASON -- the panic -- while the behaviour it
  # guards against is still live in the built library. The test is green
  # and the defect is shipped.
  #
  # That is not hypothetical in this family of crates. `am-partitions`
  # had a GPT writer that committed a table it could not read back, and
  # the two profiles gave two different panic locations: in debug the
  # library's own overflow check fired, in release the write returned
  # `Ok(())` and only the test caught it. This crate has the same shape
  # of arithmetic -- BAT entries, region offsets, block sizes scaled by
  # the logical sector size -- and until now tested only the profile
  # that hides it.
  #
  # One runner rather than the matrix: overflow behaviour is a property
  # of the profile, not the platform, and three of these would buy the
  # same evidence three times.
  test-release:
    name: test (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clone rust-fs-core sibling
        # One clone, the path dependency AND the output-budget wrapper. See
        # the `test` job above for why it used to be two.
        shell: bash
        run: |
          git clone --depth 1 --branch v0.3.1 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
          echo "FS_CORE_ROOT=$(cd ../rust-fs-core && pwd)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: test --release
        # ITS OWN TIER, NOT THE MATRIX'S, BECAUSE THIS IS A DIFFERENT RUN
        # SELECTION. It builds the same targets today and counts the same
        # number, but it is a separate `cargo test` in a separate profile: a
        # release-only build failure, a `#[cfg(debug_assertions)]` that takes
        # a module out of the release build, or a future narrowing of this
        # command empties this run without touching the matrix, and one
        # shared number would be satisfied by the other job while proving
        # nothing at all about this one.
        #
        # Measured 2026-09-17 on run 35169423886 (main, caf8dee): 220
        # executed. Floor 235 against the 270 this branch runs, and it
        # moves up with the suite.
        shell: bash
        run: |
          bash scripts/tier.sh "test (release)" release 480 31000 -- cargo test --locked --release --all-targets --features cli
          bash scripts/core.sh test-floor release 235
      - name: keep the tier log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-release
          path: tmp/logs/
          if-no-files-found: warn
          retention-days: 7

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `cargo doc` RESOLVES THE PATH DEPENDENCY, even though `cargo fmt` does
      # not -- so this job needs core beside the checkout and did not before
      # the docs step below was added. Same ref as every other job.
      - name: clone rust-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch v0.3.1 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: fmt --check
        run: cargo fmt --check
      # THE PUBLIC DOCS BUILD, AND A BROKEN LINK IS AN ERROR (#124).
      #
      # `cargo build`, `cargo test` and `cargo clippy` all ignore intra-doc
      # links, so a link to a private item or to something renamed away was
      # invisible to every gate here. Measured: clippy `-D warnings` clean and
      # all three tiers green on a tree where rustdoc reported an error.
      #
      # `-D warnings` specifically. rustdoc's default is to warn and carry on,
      # which is how a page ships with its links dead and no failure anywhere
      # -- and the errors mask each other, because rustdoc stops at the first
      # failing pass. The sibling rust-img-qcow2 reached eight this way
      # (qcow2#105), and fixing those surfaced seven more.
      - name: cargo doc (public docs build, broken links are errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: the one required check stands for every job
        run: bash scripts/core.sh ci-gate
      - name: the agent guide carries the shared block
        # AGENTS.md embeds agent-core, byte-identical with every sibling. This
        # runs the script directly rather than through `chore lint`, because
        # CI here does not install chore -- a guard wired only into a task
        # nothing runs is a guard that reports protection it is not providing.
        run: scripts/agents-core-check.sh
      # EVERY tests/scripts GUARD, BY GLOB (#143). They were named one step
      # each, so a guard added to that directory never ran until someone also
      # added a step here -- test-write-jobs-pinned.sh went green on its first
      # pull request without having run. Every guard runs even after one fails,
      # and the floor makes a glob that matched nothing a failure, not a pass.
      # tests/ci_profile.rs holds this loop and its floor in place.
      - name: script tests (tests/scripts/*.sh, by glob)
        shell: bash
        run: |
          set -uo pipefail
          ran=0; failed=0
          for t in tests/scripts/*.sh; do
            [ -f "$t" ] || continue
            echo "== $t"
            bash "$t" || failed=$((failed + 1))
            ran=$((ran + 1))
          done
          # 2: test-package-cli.sh moved to rust-fs-core with the script it
          # tested (tests/package_cli.rs there), so one guard fewer is here.
          floor=2
          echo "ran $ran script tests, $failed failed (floor $floor)"
          [ "$failed" -eq 0 ] || exit 1
          [ "$ran" -ge "$floor" ] || { echo "::error::ran $ran script tests, floor is $floor"; exit 1; }
      # The family scripts are rust-fs-core's alone: this fails if a copy of
      # one is committed here, scripts/core.sh differs from core's, or
      # anything here still calls a local copy.
      - name: no copy of a rust-fs-core family script
        shell: bash
        run: bash scripts/core.sh family-check

  # Cross-validates our reader/writer against `qemu-img`. qemu-img is
  # invoked as a subprocess only — never linked, never bundled. The
  # qemu-utils package is installed only on the CI runner.
  qemu-validation:
    name: qemu-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clone rust-fs-core sibling
        # One clone, the path dependency AND the output-budget wrapper. See
        # the `test` job above for why it used to be two.
        shell: bash
        run: |
          git clone --depth 1 --branch v0.3.1 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
          echo "FS_CORE_ROOT=$(cd ../rust-fs-core && pwd)" >> "$GITHUB_ENV"
      - name: install qemu-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: qemu cross-validation tests
        # THE FLOOR THIS REPOSITORY NEEDS MOST, AND THE SMALLEST ONE. This
        # run is doubly selective -- one integration target named on the
        # command line, behind a cargo feature -- and both halves fail open.
        # Rename tests/qemu_validation.rs together with the `--test
        # qemu_validation` here and the command that cross-validated 15
        # images against `qemu-img` runs none, exits 0, and this job reports
        # the green it reports today. Take the `qemu-validation` feature off
        # the tests inside the file and every one of them compiles out to the
        # same effect, with `qemu-img` still installed above and never
        # called. Nothing else in CI builds this target.
        #
        # Measured 2026-09-17 on run 35169423886 (main, caf8dee): 15
        # executed. Floor 13 -- a small number, and the part that matters is
        # that it is not zero.
        #
        # THE JOB ITSELF IS GUARDED NOW TOO.
        # `the_pr_gate_still_cross_validates_against_qemu_img` in
        # tests/ci_profile.rs reads this file and fails unless a gating job
        # named `qemu-validation` installs `qemu-utils` and runs `--features
        # qemu-validation --test qemu_validation`. Before it, deleting this
        # whole job left every test in the repository green -- the floor goes
        # with the step it lives in (#106).
        shell: bash
        run: |
          bash scripts/tier.sh qemu-validation qemu 120 9000 -- cargo test --locked --features qemu-validation --test qemu_validation
          bash scripts/core.sh test-floor qemu 13
      # LINTED WHERE IT IS BUILT, AND ONLY HERE CAN IT BE.
      #
      # `cargo clippy --all-targets` in the other jobs compiles this file with
      # the feature OFF, so every qemu-img call and assertion in it is
      # cfg-ed away and clippy sees an empty file. `-D warnings` is enforced
      # on every other target in this repository and was not enforced on the
      # crate's only independent oracle.
      #
      # This step and the `required-features` entry in Cargo.toml go together:
      # with the entry and without this, the file would be neither run nor
      # linted by anything except the one `cargo test` above (#110).
      - name: clippy (qemu cross-validation tests)
        run: cargo clippy --locked --features qemu-validation --test qemu_validation -- -D warnings
      - name: keep the tier log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-qemu
          path: tmp/logs/
          if-no-files-found: warn
          retention-days: 7

  # THE COMMAND-LINE TOOL AS INSTALLED, found on PATH rather than as a
  # cargo target: `scripts/cli-install.sh` builds it in release mode and
  # stages it as an install prefix (the real `rust-img-vhdx` and
  # `img.vhdx` a relative symlink to it), then `scripts/test-cli.sh` runs
  # `rust-img-vhdx doctor` first and every tests/cli/test-*.sh after it.
  # A change that breaks the tool fails the pull request, not the release.
  #
  # The oracle is qemu-img on the runner, as in `qemu-validation`: no VM.
  # The scripts are run directly rather than through `chore cli:install` and
  # `chore test:cli`, because CI here does not install chore; chores.yml
  # runs the same two commands with the same budget and floor, which
  # tests/ci_profile.rs holds the two files to.
  cli:
    name: cli (the installed tool, on PATH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clone rust-fs-core sibling
        # One clone, the path dependency AND the output-budget wrapper. See
        # the `test` job above for why it used to be two.
        shell: bash
        run: |
          git clone --depth 1 --branch v0.3.1 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
          echo "FS_CORE_ROOT=$(cd ../rust-fs-core && pwd)" >> "$GITHUB_ENV"
      - name: install qemu-utils, jq and man
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils jq man-db
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: build and stage the tool (chore cli:install)
        run: scripts/cli-install.sh
      - name: the staged tool first on PATH
        run: scripts/cli-install.sh --print-bin-dir >> "$GITHUB_PATH"
      - name: the cli tier (chore test:cli)
        # Measured on 2026-09-29 on the Mac: 20 lines, 699 bytes, 188
        # checks executed; 23 lines, 781 bytes, 308 checks on 2026-09-30
        # with `write`; 26 lines, 860 bytes, 336 checks with the man pages
        # and completions. The budget leaves room for the runner's longer
        # paths, which appear in the doctor and PATH lines; the floor is
        # about 95% of the count, and moves up with the suite.
        shell: bash
        run: |
          bash scripts/tier.sh "test (cli)" cli 35 1300 -- bash scripts/test-cli.sh
          bash scripts/core.sh test-floor cli 319
      # THE RELEASE TARBALL, PUT TOGETHER ON EVERY PULL REQUEST, so a release
      # is not the first time it is. rust-fs-core's package-cli, run through
      # scripts/core.sh, is what release.yml reaches through core's
      # release-cli workflow: it lays out the install prefix from the binary
      # just built and checks the unpacked result -- every member, each
      # dotted name a relative symlink to bin/rust-img-vhdx, every man page
      # and completion, CAVEATS at most four lines, every name's --version.
      - name: the release tarball, built and its layout checked
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          mkdir -p tmp/package
          cd tmp/package
          bash ../../scripts/core.sh package-cli "$version" linux-x86_64 ../../target/release
      - name: keep the tier log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-cli
          path: tmp/logs/
          if-no-files-found: warn
          retention-days: 7

  # ONE CHECK GATES A MERGE, AND IT STANDS FOR EVERY JOB IN THIS FILE (#105).
  #
  # Branch protection names checks, and a check is a job name, so the
  # required list is a copy of the names in this file kept in a system
  # that has no diff, no reviewer and no relationship to it. This
  # repository's copy had six entries — `fmt`, `qemu-validation`, the
  # three `test / <os>` matrix legs and `test (release)` — and both ways
  # of getting it wrong were one ordinary edit away.
  #
  # Add a fourth platform to the `os:` matrix above and its leg reports on
  # every pull request while nothing requires it: green, red, it makes no
  # difference to the merge. That is the state the sibling rust-img-qcow2
  # was found in, producing a `test / i686-unknown-linux-gnu` check that
  # was required by nobody. The opposite spelling is worse. Rename this
  # job — or write `test / release` for `test (release)`, whose
  # parentheses are literal and whose name has no slash in it — and
  # protection is left requiring a name no job produces, which GitHub
  # reads as permanently pending. With enforce_admins on that is a branch
  # nobody can merge into and no failure to point at.
  #
  # `needs:` below is that list, living beside the jobs it names and
  # changed in the same diff that renames, splits or adds one. Protection
  # names `ci-ok` alone, and that name does not move when the jobs do.
  #
  # IT FAILS ON SKIPPED AND ON CANCELLED, NOT ONLY ON FAILURE. A job that
  # was skipped is not a job that passed — it is a job that produced no
  # evidence, which is exactly what this gate exists to refuse. `if:
  # always()` is what lets it judge them at all: without it the aggregate
  # is skipped along with its needs, and a skipped required check never
  # reports, so the branch goes back to being permanently pending.
  #
  # NOTHING FROM THE OTHER WORKFLOWS IS HERE, and `needs:` could not name
  # them if it wanted to. release.yml triggers on a `v*.*.*` tag, after
  # the merge it would have gated; fuzz.yml is workflow_dispatch plus a
  # nightly cron. Neither reports on a pull request at all, and a required
  # check that never reports blocks every merge forever.
  #
  # tests/ci_aggregate_gate.rs holds both halves of this: every job in
  # this file has to appear in `needs`, and .github-guard has to require
  # `ci-ok` and nothing else.
  semver:
    # `chore check:semver`, spelled out because CI here does not install chore: this tree's public API against the newest
    # version on crates.io, refusing a break the version in Cargo.toml does
    # not declare. Why, and what it cannot see, is at the top of
    # scripts/semver-check.sh.
    name: semver (public API against crates.io)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The version scripts/semver-check.sh expects. A prebuilt binary,
      # checksum-verified by the action, rather than a ten-minute build.
      CARGO_SEMVER_CHECKS_VERSION: "0.50.0"
      # A failing tier prints only its verdict by default. Here the tail IS
      # the answer -- which items broke -- so it is printed in full.
      OUTPUT_BUDGET_FAIL_TAIL: "200"
    steps:
      - uses: actions/checkout@v4
      - name: clone rust-fs-core sibling
        shell: bash
        run: |
          git clone --depth 1 --branch v0.3.1 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
          echo "FS_CORE_ROOT=$(cd ../rust-fs-core && pwd)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@${{ env.CARGO_SEMVER_CHECKS_VERSION }}
      - name: semver (quiet, budgeted)
        shell: bash
        run: bash scripts/tier.sh semver semver 40 4000 -- bash scripts/core.sh semver-check

  ci-ok:
    name: ci-ok
    needs: [test, test-release, fmt, qemu-validation, cli, semver]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every gating job must have concluded success
        # `toJSON(needs)` rather than a line per job: the script then says
        # nothing about which jobs exist, so adding one to `needs:` above
        # is the whole edit and there is no second list to forget.
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::not green: $bad (failed, cancelled or skipped)"
            exit 1
          fi
          echo "all gating jobs succeeded"
