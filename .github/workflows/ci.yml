name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: clone am-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch v0.2.3 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --locked --all-targets
      - name: test
        run: cargo test --locked --all-targets
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: fmt --check
        run: cargo fmt --check

  # Cross-validates our reader/writer against `qemu-img`. qemu-img is
  # invoked as a subprocess only — never linked, never bundled. The
  # qemu-utils package is installed only on the CI runner.
  qemu-validation:
    name: qemu-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clone am-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch v0.2.3 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
      - name: install qemu-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: qemu cross-validation tests
        run: cargo test --locked --features qemu-validation --test qemu_validation
