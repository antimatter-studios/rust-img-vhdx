[package]
name = "vhdx-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# The explorer half of the fuzzing setup. The gate half is
# tests/fuzz_decoders.rs in the parent crate, which replays and mutates
# the same corpus on the stable toolchain -- see that file's header for
# why the work is split in two.
#
# Run one target:
#   cargo +nightly fuzz run image -- -max_total_time=60
# Run all of them, which is what CI does:
#   scripts/fuzz-all.sh 60

[dependencies]
libfuzzer-sys = "0.4"
am-img-vhdx = { path = ".." }
am-fs-core = { path = "../../rust-fs-core", version = "0.2.10" }

[[bin]]
name = "image"
path = "fuzz_targets/image.rs"
test = false
doc = false
bench = false

[[bin]]
name = "header"
path = "fuzz_targets/header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "region_table"
path = "fuzz_targets/region_table.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metadata"
path = "fuzz_targets/metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "log"
path = "fuzz_targets/log.rs"
test = false
doc = false
bench = false
